# ─────────────────────────────────────────────────────────────────────────────
# Canopus Manifest — Topology 5: Passive Monitoring / Protocol Checker Only
# ─────────────────────────────────────────────────────────────────────────────
# Stimulus-free testbench used in emulation, silicon bring-up, or where
# stimulus is generated by embedded firmware rather than UVM sequences.
# Both agents are passive (no sequencer or driver). All communication is
# via analysis ports, producing the highest fan-out pattern of all five
# topologies (two sources each feeding three sinks = six analysis edges).
#
# Key schema features exercised:
#   - mode: passive on both agents (no sequencer or driver children)
#   - Pure analysis-port graph — no tlm.blocking_get edges at all
#   - Maximum analysis fan-out (2 × 3 = 6 analysis connections)
#   - uvm_protocol_checker and uvm_subscriber component types
#   - Validates graceful rendering of structurally incomplete agents
#     (passive agents must still visually read as agents despite missing
#     sub-components)
# ─────────────────────────────────────────────────────────────────────────────

canopus: "0.1"
name: passive_monitoring
description: >
  Stimulus-free environment with two passive agents (APB and AXI monitors
  only, no sequencer or driver). All six connections are analysis ports
  feeding a protocol checker, coverage collector, and transaction logger.
  Representative of emulation or bring-up monitoring configurations.
tags:
  - passive
  - protocol-checking
  - no-stimulus
  - analysis-fan-out
  - emulation

components:
  - id: test
    type: uvm_test
    label: monitor_test
    level: 0
    children:
      - id: env
        type: uvm_env
        label: monitor_env
        level: 1
        children:
          - id: apb_agent
            type: uvm_agent
            label: apb_agent
            mode: passive
            level: 2
            children:
              - id: apb_mon
                type: uvm_monitor
                label: apb_monitor
                level: 3

          - id: axi_agent
            type: uvm_agent
            label: axi_agent
            mode: passive
            level: 2
            children:
              - id: axi_mon
                type: uvm_monitor
                label: axi_monitor
                level: 3

          - id: checker
            type: uvm_protocol_checker
            label: protocol_checker
            level: 2
            meta:
              checks:
                - apb_no_idle_during_transfer
                - axi_outstanding_limit
                - axi_apb_ordering

          - id: coverage
            type: uvm_coverage_collector
            label: bus_coverage
            level: 2

          - id: logger
            type: uvm_subscriber
            label: transaction_logger
            level: 2
            meta:
              log_format: csv
              log_file: transactions.csv

connections:
  # APB monitor → three analysis sinks
  - id: c_apb_mon_chk
    from: apb_mon
    to: checker
    type: tlm.analysis
    transaction: apb_seq_item

  - id: c_apb_mon_cov
    from: apb_mon
    to: coverage
    type: tlm.analysis
    transaction: apb_seq_item

  - id: c_apb_mon_log
    from: apb_mon
    to: logger
    type: tlm.analysis
    transaction: apb_seq_item

  # AXI monitor → three analysis sinks
  - id: c_axi_mon_chk
    from: axi_mon
    to: checker
    type: tlm.analysis
    transaction: axi_seq_item

  - id: c_axi_mon_cov
    from: axi_mon
    to: coverage
    type: tlm.analysis
    transaction: axi_seq_item

  - id: c_axi_mon_log
    from: axi_mon
    to: logger
    type: tlm.analysis
    transaction: axi_seq_item
